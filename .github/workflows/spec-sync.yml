name: Spec sync

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Re-fetch the spec from the pinned ref in SOURCE.md
        run: |
          REF="$(grep -oE '[0-9a-f]{40}' spec/SOURCE.md | head -n1)"
          if [ -z "$REF" ]; then
            REF="$(grep -oE 'Pinned ref \| `[^`]+`' spec/SOURCE.md | sed -E 's/.*`([^`]+)`.*/\1/')"
          fi
          echo "Fetching spec at ref: $REF"
          curl -fsSL \
            "https://raw.githubusercontent.com/lunogram/platform/$REF/internal/http/controllers/v1/client/oapi/resources.yml" \
            -o spec/client.yaml

      - name: Regenerate models
        run: ./scripts/generate.sh

      - name: Open a PR if the spec or generated code changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: spec-sync/update
          title: "chore: sync OpenAPI spec and regenerate models"
          commit-message: "chore: sync OpenAPI spec and regenerate models"
          body: |
            Automated spec sync.

            Re-fetched `spec/client.yaml` from the pinned ref in `spec/SOURCE.md`
            and regenerated `src/lunogram/gen/models.py`. Review the diff before
            merging; bump the pinned ref in `spec/SOURCE.md` if appropriate.
          add-paths: |
            spec/client.yaml
            src/lunogram/gen/models.py
